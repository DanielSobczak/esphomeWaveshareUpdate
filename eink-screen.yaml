esphome:
  name: eink-screen
  friendly_name: eink-screen
  on_boot:
    priority: -100.0  # Run after all components and sensors are initialized
    then:
      - wait_until:
          condition:
            lambda: 'return id(data_updated) == true;'
          timeout: 25s
      - delay: 3s  # Let remaining sensors arrive after the first one triggers
      - script.execute: update_screen
      - deep_sleep.enter: deep_sleep_control

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: http://github.com/DanielSobczak/esphomeWaveshareUpdate
      #ref: v0.1
      ref: new_lut_from_dev
    components: [ waveshare_epaper ]
    refresh: 0s

  # - source: github://pr#7751
  #   components: [ waveshare_epaper ]

#with state machine
