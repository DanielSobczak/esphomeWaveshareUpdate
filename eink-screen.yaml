# Script for updating screen - Refresh display and publish refresh count and time. (Thanks @paviro!)
script:
  - id: update_screen
    then:
      - lambda: 'id(data_updated) = false;'
      - lambda: 'id(eink_display).set_fast_refresh(id(recorded_display_refresh) % 10 != 0);'
      - component.update: eink_display
      - lambda: 'id(recorded_display_refresh) += 1;'
#      - lambda: 'id(display_last_update).publish_state(id(homeassistant_time).now().timestamp);'

# Pins for Waveshare ePaper ESP Board
spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14

display:
  - platform: waveshare_epaper
    id: eink_display
    cs_pin: GPIO15
    dc_pin: GPIO27
    busy_pin:
      number: GPIO25
      inverted: true
    reset_pin: GPIO26
    #reset_duration: 200ms
    #update_interval: 30s
    #reset_duration: 2ms
    #model: 7.50in-bv2-rb
    #model: 7.50in-bv3my
    model: 7.50in-bv3
    #model: 7.50in-bv2-rb
    #model: 7.50in-bV3-bwr
    fast_refresh: true
    update_interval: never
    rotation: 0°
    lambda: |-
      // Map weather states to MDI characters.
      std::map<std::string, std::string> moon_icon_map
        {
          {"first_quarter", "\U000F0F61"},
          {"full_moon", "\U000F0F62"},
          {"last_quarter", "\U000F0F63"},
          {"new_moon", "\U000F0F64"},
          {"waning_crescent", "\U000F0F65"},
          {"waning_gibbous", "\U000F0F66"},
          {"waxing_crescent", "\U000F0F67"},
          {"waxing_gibbous", "\U000F0F68"},
          
        };
      std::map<std::string, std::string> weather_icon_map
        {
          {"cloudy", "\U000F0590"},
          {"cloudy-alert", "\U000F0F2F"},
          {"cloudy-arrow-right", "\U000F0E6E"},
          {"fog", "\U000F0591"},
          {"hail", "\U000F0592"},
          {"hazy", "\U000F0F30"},
          {"hurricane", "\U000F0898"},
          {"lightning", "\U000F0593"},
          {"lightning-rainy", "\U000F067E"},
          {"night", "\U000F0594"},
          {"clear-night", "\U000F0594"},
          {"night-partly-cloudy", "\U000F0F31"},
          {"partlycloudy", "\U000F0595"},
          {"partly-lightning", "\U000F0F32"},
          {"partly-rainy", "\U000F0F33"},
          {"partly-snowy", "\U000F0F34"},
          {"partly-snowy-rainy", "\U000F0F35"},
          {"pouring", "\U000F0596"},
          {"rainy", "\U000F0597"},
          {"snowy", "\U000F0598"},
          {"snowy-heavy", "\U000F0F36"},
          {"snowy-rainy", "\U000F067F"},
          {"sunny", "\U000F0599"},
          {"sunny-alert", "\U000F0F37"},
          {"sunny-off", "\U000F14E4"},
          {"sunset", "\U000F059A"},
          {"sunset-down", "\U000F059B"},
          {"sunset-up", "\U000F059C"},
          {"tornado", "\U000F0F38"},
          {"windy", "\U000F059D"},
          {"windy-variant", "\U000F059E"},
        };

      #define x1 90 // x position for first weather icon
      #define wSpace 70 // x space for weather icon
      #define weatherYStart 130 // x space for weather icon

      //it.printf(180, 20, id(font_title), TextAlign::TOP_CENTER, "WEATHER");

      // weather
      it.printf(90, 20, id(font_mdi_large), TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_condition_now).state.c_str()].c_str());
      it.printf(240, 35, id(font_large_bold), TextAlign::TOP_CENTER, "%2.0f°C", id(weather_temperature).state);

      it.printf(x1, weatherYStart, id(font_small_book), TextAlign::TOP_CENTER, "%s", id(weather_timestamp_0).state.c_str()); //24
      it.printf(x1, weatherYStart + 24, id(font_mdi_medium), TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_condition_0).state.c_str()].c_str());
      it.printf(x1, weatherYStart + 72, id(font_small_bold), TextAlign::TOP_CENTER, "%2.0f°C", id(weather_temperature_0).state);

      it.printf(x1 + wSpace, weatherYStart, id(font_small_book), TextAlign::TOP_CENTER, "%s", id(weather_timestamp_1).state.c_str());
      it.printf(x1 + wSpace, weatherYStart + 24, id(font_mdi_medium), TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_condition_1).state.c_str()].c_str());
      it.printf(x1 + wSpace, weatherYStart + 72, id(font_small_bold), TextAlign::TOP_CENTER, "%2.0f°C", id(weather_temperature_1).state);

      it.printf(x1 + 2*wSpace, weatherYStart, id(font_small_book), TextAlign::TOP_CENTER, "%s", id(weather_timestamp_2).state.c_str());
      it.printf(x1 + 2*wSpace, weatherYStart + 24, id(font_mdi_medium), TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_condition_2).state.c_str()].c_str());
      it.printf(x1 + 2*wSpace, weatherYStart + 72, id(font_small_bold), TextAlign::TOP_CENTER, "%2.0f°C", id(weather_temperature_2).state);

      it.printf(x1 + 3*wSpace, weatherYStart, id(font_small_book), TextAlign::TOP_CENTER, "%s", id(weather_timestamp_3).state.c_str());
      it.printf(x1 + 3*wSpace, weatherYStart + 24, id(font_mdi_medium), TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_condition_3).state.c_str()].c_str());
      it.printf(x1 + 3*wSpace, weatherYStart + 72, id(font_small_bold), TextAlign::TOP_CENTER, "%2.0f°C", id(weather_temperature_3).state);

      it.printf(x1 + 1.5 * wSpace, weatherYStart + 100, id(fontMedium), TextAlign::TOP_CENTER, "%s", id(will_rain_today_msg).state.c_str());
      // end weather 

      // Draw separation lines
      it.line(440, 0, 440, 480);
      it.line(0, 270, 800, 270);

      //temps
      #define tempsTitleYStart 300 
      #define tempsTitleXStart 60 
      #define titleBottomPadding 40
      #define tempRowPadding 50
      int tempTitleRowX = tempsTitleXStart + 42;
      int tempValueRowX =  tempTitleRowX + 132;
      int tempFirstRowY = tempsTitleYStart + titleBottomPadding;

      it.printf(tempsTitleXStart, tempsTitleYStart, id(fontMedium), TextAlign::BASELINE_LEFT, "Temperatury");
      it.printf(tempTitleRowX, tempFirstRowY, id(fontMedium), TextAlign::BASELINE_LEFT, "Salon");
      it.printf(tempValueRowX, tempFirstRowY, id(fontMedium), TextAlign::BASELINE_LEFT, "%.1f °C", id(temp_salon).state); 
      it.printf(tempTitleRowX, tempFirstRowY + tempRowPadding, id(fontMedium), TextAlign::BASELINE_LEFT,"Goscinny");
      it.printf(tempValueRowX, tempFirstRowY + tempRowPadding, id(fontMedium), TextAlign::BASELINE_LEFT, "%.1f °C", id(temp_goscinny).state);
      it.printf(tempTitleRowX, tempFirstRowY + 2*tempRowPadding, id(fontMedium), TextAlign::BASELINE_LEFT, "Balkon");
      it.printf(tempValueRowX, tempFirstRowY + 2*tempRowPadding, id(fontMedium), TextAlign::BASELINE_LEFT, "%.1f °C", id(temp_balkon).state);
      //end temps

      it.printf(480, 330, id(fontMedium), TextAlign::BASELINE_LEFT, "Days until Christmas");
      it.printf(550, 400, id(font_large_bold), TextAlign::BASELINE_LEFT, "%d", int(id(days_till).state));

      #define calX 460
      #define calY 25
      #define calWidth 320
      
      // Robust word-wrap drawing for calendar items
      auto draw_cal = [&](int x, int &y, const std::string &text) {
        std::string rem = text;
        while (!rem.empty() && y < 250) {
          std::string line = rem;
          int b_x, b_y, b_w, b_h;
          it.get_text_bounds(0, 0, line.c_str(), id(font_small_bold), TextAlign::TOP_LEFT, &b_x, &b_y, &b_w, &b_h);
          while (b_w > calWidth) {
            size_t space = line.find_last_of(' ');
            if (space == std::string::npos) { line.pop_back(); if(line.empty()) break; }
            else line = line.substr(0, space);
            it.get_text_bounds(0, 0, line.c_str(), id(font_small_bold), TextAlign::TOP_LEFT, &b_x, &b_y, &b_w, &b_h);
          }
          it.print(x, y, id(font_small_bold), line.c_str());
          y += 22; 
          if (line.empty() || line.length() >= rem.length()) break;
          rem = rem.substr(line.length());
          if (!rem.empty() && rem[0] == ' ') rem = rem.substr(1);
        }
        y += 8;
      };

      int y_pos = calY;
      // Draw Date Title
      it.printf(calX, y_pos, id(fontMedium), TextAlign::TOP_LEFT, "%s", id(calendar_event_date).state.c_str());
      y_pos += 35;

      // Draw up to 5 events for that day
      draw_cal(calX, y_pos, id(calendar_event_0).state);
      draw_cal(calX, y_pos, id(calendar_event_1).state);
      draw_cal(calX, y_pos, id(calendar_event_2).state);
      draw_cal(calX, y_pos, id(calendar_event_3).state);
      draw_cal(calX, y_pos, id(calendar_event_4).state);


